<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xtream IPTV Web App</title> <!-- Changed title slightly -->
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <section id="login-section"> <!-- Wrap existing login form -->
        <div class="login-container">
            <h1>Welcome Back</h1>
            <p>Login to access your Xtream IPTV channels.</p>
            <form id="login-form">
                <div class="input-group">
                    <label for="server-url">Server URL (e.g., http://my.iptv.server:8080)</label>
                    <input type="text" id="server-url" name="server-url" required placeholder="http://your.server.url:port">
                </div>
                <div class="input-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required placeholder="Your Username">
                </div>
                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required placeholder="Your Password">
                </div>
                <button type="submit" id="login-button">Login</button>
                <div id="message-area" class="message-area"></div>
            </form>
        </div>
    </section>

    <section id="main-app-section" style="display: none;"> <!-- Main app content, hidden by default -->
        <header class="app-header">
            <h1>Xtream IPTV Player</h1>
            <div class="header-controls">
                <input type="search" id="search-box" placeholder="Search channels...">
                <button id="logout-button">Logout</button>
            </div>
        </header>
        <div class="app-body">
            <aside id="categories-sidebar">
                <h2>Categories</h2>
                <div id="categories-container">
                    <!-- Categories will be loaded here by JavaScript -->
                    <p>Loading categories...</p>
                </div>
            </aside>
            <main id="channels-content">
                <h2>Channels</h2>
                <div id="channels-container">
                    <!-- Channels will be loaded here -->
                    <p>Select a category to see channels.</p>
                </div>
            </main>
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
