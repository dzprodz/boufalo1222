<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Futuristic IPTV Player</title> 

    <!-- Google Fonts (Inter) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Material Symbols (Rounded) -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />

    <!-- Video.js CSS -->
    <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" /> 
    
    <!-- Main Stylesheet (new or cleared) -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app-container">

        <!-- Login View (Initially visible, hidden after login) -->
        <section id="login-view" class="app-view">
            <div class="login-box">
                <h1 class="app-title-login">STREAM<span class="title-accent">X</span></h1>
                <p class="login-tagline">Enter the Future of Streaming</p>
                <form id="login-form">
                    <div class="input-group">
                        <span class="material-symbols-rounded">dns</span>
                        <input type="text" id="server-url" required placeholder="Server URL (e.g., http://my.server:port)">
                    </div>
                    <div class="input-group">
                        <span class="material-symbols-rounded">person</span>
                        <input type="text" id="username" required placeholder="Username">
                    </div>
                    <div class="input-group">
                        <span class="material-symbols-rounded">password</span>
                        <input type="password" id="password" required placeholder="Password">
                    </div>
                    <button type="submit" id="login-button" class="cta-button">
                        <span class="material-symbols-rounded">login</span> Connect
                    </button>
                </form>
                <div class="login-alternative">
                    <p>Or load your own playlist:</p>
                    <button id="m3u-upload-trigger-button" class="secondary-button">
                        <span class="material-symbols-rounded">playlist_add</span> Upload M3U File
                    </button>
                </div>
                <div id="login-message-area" class="message-area"></div>
            </div>
        </section>

        <!-- Main App View (Initially hidden, shown after login/M3U load) -->
        <main id="main-app-view" class="app-view" style="display: none;">
            <aside id="sidebar">
                <div class="sidebar-header">
                    <h2 class="app-title-main">STREAM<span class="title-accent">X</span></h2>
                    <button id="sidebar-toggle-mobile" class="icon-button mobile-only" title="Toggle Menu">
                        <span class="material-symbols-rounded">menu</span>
                    </button>
                </div>
                <nav id="category-nav">
                    <!-- Categories will be loaded here -->
                    <div class="nav-placeholder">Loading Categories...</div>
                </nav>
                <div class="sidebar-footer">
                    <button id="settings-button" class="icon-button" title="Settings">
                        <span class="material-symbols-rounded">settings</span>
                    </button>
                    <button id="logout-button-main" class="icon-button" title="Logout">
                        <span class="material-symbols-rounded">logout</span>
                    </button>
                     <button id="m3u-upload-sidebar-button" class="icon-button" title="Upload M3U">
                        <span class="material-symbols-rounded">file_upload</span>
                    </button>
                </div>
            </aside>

            <section id="content-area">
                <header id="content-header">
                    <div class="search-container">
                        <span class="material-symbols-rounded">search</span>
                        <input type="search" id="search-input" placeholder="Search content...">
                    </div>
                    <div id="user-profile-area">
                        <!-- User info / Theme toggle might go here -->
                    </div>
                </header>
                <div id="breadcrumbs-bar">
                    <!-- Breadcrumbs or current category display -->
                </div>
                <div id="channel-grid-container">
                    <!-- Channel/VOD cards will be loaded here -->
                    <div class="grid-placeholder">Select a category to browse.</div>
                </div>
                <div id="recently-watched-container">
                    <!-- Recently watched items -->
                </div>
                <div id="media-info-view-container">
                    <!-- Detailed media info display -->
                </div>
            </section>
        </main>

        <!-- Player View (Modal Overlay) -->
        <div id="player-view-modal" class="modal-overlay"> <!-- display:none removed -->
            <div class="player-modal-content">
                <video id="main-video-player" class="video-js vjs-big-play-centered" playsinline controls preload="auto" width="640" height="360">
                    <p class="vjs-no-js">
                        To view this video please enable JavaScript, and consider upgrading to a
                        web browser that <a href="https://videojs.com/html5-video-support/" target="_blank">supports HTML5 video</a>
                    </p>
                </video>
                <button id="player-close-button" class="icon-button player-close" title="Close Player">
                    <span class="material-symbols-rounded">close</span>
                </button>
                <div id="player-stream-title">Now Playing: ...</div>
            </div>
        </div>

        <!-- Settings Modal (Example, initially hidden) -->
        <div id="settings-modal" class="modal-overlay" style="display: none;">
            <div class="settings-modal-content">
                <h3>Settings</h3>
                <!-- Theme toggles, other settings -->
                <button id="settings-close-button" class="secondary-button">Close</button>
            </div>
        </div>
        
        <!-- Hidden file input for M3U -->
        <input type="file" id="m3u-file-input-main" accept=".m3u,.m3u8" style="display: none;">
    </div>

    <script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script> 
    <script src="script.js"></script> 
</body>
</html>
