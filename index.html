<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xtream IPTV Web App</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <!-- Material Symbols Rounded -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
    <!-- HLS.js Library -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body>
    <section id="login-section"> 
        <div class="login-container">
            <h1>Welcome Back</h1>
            <p>Login to access your Xtream IPTV channels.</p>
            <form id="login-form">
                <div class="input-group">
                    <label for="server-url">Server URL (e.g., http://my.iptv.server:8080)</label>
                    <input type="text" id="server-url" name="server-url" required placeholder="http://your.server.url:port">
                </div>
                <div class="input-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required placeholder="Your Username">
                </div>
                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required placeholder="Your Password">
                </div>
                <button type="submit" id="login-button">Login</button>
                <div id="message-area" class="message-area"></div>
            </form>
        </div>
    </section>

    <section id="main-app-section" style="display: none;"> 
        <header class="app-header">
            <button id="category-toggle-button" class="material-symbols-rounded mobile-only">menu</button> <!-- New Button -->
            <h1>Xtream IPTV Player</h1>
            <div class="header-controls">
                <div class="search-wrapper"> 
                    <span class="material-symbols-rounded search-icon">search</span>
                    <input type="search" id="search-box" placeholder="Search channels...">
                </div>
                <button id="logout-button">
                    <span class="material-symbols-rounded">logout</span> Logout
                </button>
            </div>
        </header>
        <div class="app-body">
            <aside id="categories-sidebar">
                <h3>Categories</h3> 
                <div id="categories-container">
                    <p>Loading categories...</p>
                </div>
            </aside>
            <main id="channels-content">
                <h2>Channels</h2>
                <div id="channels-container">
                    <p>Select a category to see channels.</p>
                </div>
            </main>
        </div>
    </section>

    <!-- Player Modal -->
    <div id="player-modal" class="player-modal-overlay" style="display: none;">
        <div class="player-container"> 
            <button id="close-player-button" class="close-player-btn">
                <span class="material-symbols-rounded">close</span>
            </button>
            <video id="video-player" controls width="100%"></video>
            <div id="player-stream-info" class="player-stream-name"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
